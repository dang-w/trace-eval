[project]
name = "trace-eval"
version = "0.1.0"
description = "A minimal eval harness with pluggable scorers, real trace capture, and a public findings ledger where the harness catches its own vacuous scorers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
trace-eval = "traceeval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
